# Live reload for `make dev-backend` / `make dev-api-air`.
# No global install: `go run github.com/air-verse/air@v1.67.4 -c .air.toml`
# from this directory. Rebuilds ./cmd/api when Go files change.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
delay = 1000
stop_on_error = true
# Integer kill_delay is milliseconds (air treats values < 1ms as ms).
send_interrupt = true
kill_delay = 500

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
