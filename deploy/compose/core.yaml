# Core open-bot dependencies (always on — no profile)
services:
  postgres:
    # pgvector image (dev: recreate volume if upgrading from plain postgres)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
      POSTGRES_DB: openbot
    ports:
      - "5432:5432"
    volumes:
      - openbot_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openbot
      MINIO_ROOT_PASSWORD: openbotopenbot
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - openbot_minio:/data

volumes:
  openbot_pg:
  openbot_minio:
