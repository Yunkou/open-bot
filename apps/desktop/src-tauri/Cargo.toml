[package]
name = "open-bot-desktop"
version = "0.1.0"
description = "Open Bot desktop shell"
authors = ["open-bot"]
edition = "2021"

[lib]
name = "open_bot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.63"
russh-sftp = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
